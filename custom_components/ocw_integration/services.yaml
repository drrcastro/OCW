create_timer:
  name: Create a car timer
  description: Create an automatic action for a car. Choose the action and time, then use either a specific date or one or more weekdays.
  fields:
    entry_id:
      name: Integration entry ID
      description: Select the OpenCarWings integration entry that contains the car.
      required: false
      selector:
        config_entry:
          integration: ocw_integration
    device_id:
      name: Car
      description: Select the car that should perform the action. The VIN is found automatically.
      required: false
      selector:
        device:
          integration: ocw_integration
    vin:
      name: Car VIN
      description: The VIN of the car. Use this when calling the service from YAML; in the visual editor, select the car above instead.
      required: false
      selector:
        text:
    name:
      name: Timer name
      description: A short name that explains the purpose, for example Morning climate or Charge before work.
      required: true
      selector:
        text:
    time:
      name: Start time
      description: The local time when the action should run.
      required: true
      selector:
        time:
    command_type:
      name: Action
      description: What the car should do at the selected time.
      default: "3"
      selector:
        select:
          options:
            - label: Turn A/C on
              value: "3"
            - label: Turn A/C off
              value: "4"
            - label: Start charging
              value: "2"
            - label: Start charging to 80%
              value: "6"
            - label: Refresh car data
              value: "1"
            - label: Unlock doors
              value: "7"
            - label: Lock doors
              value: "8"
            - label: Horn
              value: "9"
            - label: Lights
              value: "10"
            - label: Horn and lights
              value: "11"
            - label: Stop horn and lights
              value: "12"
            - label: Remote start
              value: "13"
            - label: Remote stop
              value: "14"
    timer_type:
      name: Schedule type
      description: Choose One time for a single date, or Weekly to repeat on selected weekdays.
      default: "0"
      selector:
        select:
          options:
            - label: One time
              value: "0"
            - label: Weekly
              value: "1"
    enabled:
      name: Enable timer now
      description: Turn this off if you want to create the timer without activating it yet.
      default: true
      selector:
        boolean:
    date:
      name: Date
      description: For a one-time timer, choose the date on which the action should run. Leave empty for a weekly timer.
      selector:
        date:
    weekday_mon:
      name: Monday
      description: Select this for a weekly timer that should run on Monday.
      default: false
      selector:
        boolean:
    weekday_tue:
      name: Tuesday
      default: false
      selector:
        boolean:
    weekday_wed:
      name: Wednesday
      default: false
      selector:
        boolean:
    weekday_thu:
      name: Thursday
      default: false
      selector:
        boolean:
    weekday_fri:
      name: Friday
      default: false
      selector:
        boolean:
    weekday_sat:
      name: Saturday
      default: false
      selector:
        boolean:
    weekday_sun:
      name: Sunday
      description: Select this for a weekly timer that should run on Sunday.
      default: false
      selector:
        boolean:

update_timer:
  name: Update a car timer
  description: Change an existing timer, including its action, schedule, or enabled state. Use enabled false to pause it without deleting it.
  fields:
    entry_id:
      name: Integration entry ID
      description: The ID of this OpenCarWings integration entry.
      required: false
      selector:
        config_entry:
          integration: ocw_integration
    vin:
      name: Car VIN
      description: The VIN of the car that owns the timer. Use this when calling the service from YAML; in the visual editor, select the car above instead.
      required: false
      selector:
        text:
    device_id:
      name: Car
      description: Select the car that owns the timer. The VIN is found automatically.
      required: false
      selector:
        device:
          integration: ocw_integration
    timer_id:
      name: Timer ID
      description: The numeric ID of the timer. Find it in the timer data returned by the API or in Home Assistant's service trace.
      required: true
      selector:
        number:
          min: 1
          mode: box
    enabled:
      name: Enable timer
      description: Turn on to activate the timer, or turn off to pause it without deleting it.
      selector:
        boolean:
    name:
      name: Timer name
      description: Replace the timer's name.
      selector:
        text:
    time:
      name: Start time
      description: Replace the local time when the action should run.
      selector:
        time:
    date:
      name: Date
      description: Replace the date for a one-time timer.
      selector:
        date:
    command_type:
      name: Action
      description: Replace the action performed by the timer.
      selector:
        select:
          options:
            - label: Turn A/C on
              value: "3"
            - label: Turn A/C off
              value: "4"
            - label: Start charging
              value: "2"
            - label: Start charging to 80%
              value: "6"
            - label: Refresh car data
              value: "1"
            - label: Unlock doors
              value: "7"
            - label: Lock doors
              value: "8"
            - label: Horn
              value: "9"
            - label: Lights
              value: "10"
            - label: Horn and lights
              value: "11"
            - label: Stop horn and lights
              value: "12"
            - label: Remote start
              value: "13"
            - label: Remote stop
              value: "14"
    timer_type:
      name: Schedule type
      description: Choose One time for a single date, or Weekly to repeat on selected weekdays.
      selector:
        select:
          options:
            - label: One time
              value: "0"
            - label: Weekly
              value: "1"
    weekday_mon:
      name: Monday
      selector:
        boolean:
    weekday_tue:
      name: Tuesday
      selector:
        boolean:
    weekday_wed:
      name: Wednesday
      selector:
        boolean:
    weekday_thu:
      name: Thursday
      selector:
        boolean:
    weekday_fri:
      name: Friday
      selector:
        boolean:
    weekday_sat:
      name: Saturday
      selector:
        boolean:
    weekday_sun:
      name: Sunday
      selector:
        boolean:

delete_timer:
  name: Delete a car timer
  description: Permanently remove an existing timer. Use Update a car timer with enabled false when you only want to pause it.
  fields:
    entry_id:
      name: Integration entry ID
      description: The ID of this OpenCarWings integration entry.
      required: false
      selector:
        config_entry:
          integration: ocw_integration
    vin:
      name: Car VIN
      description: The VIN of the car that owns the timer. Use this when calling the service from YAML; in the visual editor, select the car above instead.
      required: false
      selector:
        text:
    device_id:
      name: Car
      description: Select the car that owns the timer. The VIN is found automatically.
      required: false
      selector:
        device:
          integration: ocw_integration
    timer_id:
      name: Timer ID
      description: The numeric ID of the timer you want to remove.
      required: true
      selector:
        number:
          min: 1
          mode: box
